name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency: deploy-api

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/orisabiyi/novashelf-api

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: vars.EC2_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.EC2_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy compose files
        run: scp server/deploy/compose.yaml server/deploy/Caddyfile ubuntu@${{ vars.EC2_HOST }}:/opt/novashelf/
      - name: Start the new image
        run: |
          ssh ubuntu@${{ vars.EC2_HOST }} "cd /opt/novashelf \
            && export API_IMAGE_TAG=${{ github.sha }} \
            && docker compose pull --quiet \
            && docker compose up -d --remove-orphans \
            && docker image prune -f"
      - name: Check health
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors --max-time 20 https://${{ vars.EC2_HOST }}/api/health
