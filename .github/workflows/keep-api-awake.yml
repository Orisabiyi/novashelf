# Render's free plan puts the API to sleep after 15 minutes without traffic, and waking it takes
# up to a minute. Ping it every 10 minutes (GitHub often starts scheduled runs late, so 15 would
# leave gaps). One always-on service stays within the free 750 instance hours a month.
# GitHub pauses schedules after 60 days without commits; re-enable it from the Actions tab.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 90 https://novashelf-api.onrender.com/api/health
