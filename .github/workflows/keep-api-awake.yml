# Render sleeps after 15 idle minutes; GitHub often starts scheduled runs late, hence every 10.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 90 https://novashelf-api.onrender.com/api/health
