services:
  - type: web
    name: novashelf-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./server
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - server/**
    envVars:
      - key: PORT
        value: "8080"
      - key: ConnectionStrings__Default
        sync: false
      - key: ConnectionStrings__Migrations
        sync: false
      - key: Images__SigningKey
        generateValue: true
      # Render's Cloudflare edge sets this to the connecting address and rejects requests that
      # forge it, so the sign-in rate limits can trust it (see Accounts/ClientAddress.cs).
      - key: Proxy__ClientAddressHeader
        value: CF-Connecting-IP
